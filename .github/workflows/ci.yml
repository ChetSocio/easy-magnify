name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  react-19-consumer:
    name: React 19 consumer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify clean React 19 consumer install
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/easy-magnify-pack /tmp/easy-magnify-react19
          TARBALL="$(npm pack --silent --pack-destination /tmp/easy-magnify-pack)"
          cd /tmp/easy-magnify-react19
          npm init -y >/dev/null
          npm install --no-audit --no-fund react@^19 react-dom@^19 @types/react@^19 @types/react-dom@^19
          npm install --no-audit --no-fund "/tmp/easy-magnify-pack/${TARBALL}"
          npm ls easy-magnify react react-dom
      - name: Verify client directive
        shell: bash
        run: |
          set -euo pipefail
          head -n 5 dist/index.mjs | grep -F '"use client";'
          head -n 5 dist/index.js | grep -F '"use client";'
